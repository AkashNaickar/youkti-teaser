name: CI
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate HTML, local assets and anchors
        run: node scripts/validate-site.mjs
